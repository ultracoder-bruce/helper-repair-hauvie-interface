<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">Hauvie helper pipeline architecture</title>
  <desc id="desc">A staged pipeline from input ingestion through tokenization, AST validation, core diagnostic logic, and C or Java routing. Syntax errors stop at tokenization. Critical Hauvies severity or sulking produces a structured critical report that can still be routed.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#526579"/>
    </marker>
    <marker id="error-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#bd3c45"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #172b3a; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #526579; }
      .stage { fill: #f4f8fc; stroke: #42637f; stroke-width: 2; rx: 14; }
      .core { fill: #edf7f2; stroke: #26845c; stroke-width: 2.5; rx: 14; }
      .route { fill: #f4f1fb; stroke: #7354a5; stroke-width: 2; rx: 14; }
      .error { fill: #fff3f1; stroke: #bd3c45; stroke-width: 2; rx: 12; }
      .stage-name { font-size: 19px; font-weight: 700; }
      .stage-file { font-size: 14px; fill: #42637f; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .body { font-size: 14px; fill: #405467; }
      .small { font-size: 13px; fill: #526579; }
      .flow { fill: none; stroke: #526579; stroke-width: 2.5; marker-end: url(#arrow); }
      .failure-flow { fill: none; stroke: #bd3c45; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#error-arrow); }
      .label { font-size: 13px; font-weight: 650; fill: #405467; }
    </style>
  </defs>

  <rect width="1200" height="860" fill="#ffffff"/>
  <text x="600" y="52" text-anchor="middle" class="title">Hauvie Helper — Core Pipeline</text>
  <text x="600" y="79" text-anchor="middle" class="subtitle">Syntax parsing, domain diagnosis, and output routing are separate stages</text>

  <!-- Main flow -->
  <rect x="70" y="128" width="230" height="116" class="stage"/>
  <text x="185" y="161" text-anchor="middle" class="stage-name">Input hub</text>
  <text x="185" y="185" text-anchor="middle" class="stage-file">src/main.c</text>
  <text x="185" y="211" text-anchor="middle" class="body">CLI / submitted input</text>

  <rect x="370" y="128" width="230" height="116" class="stage"/>
  <text x="485" y="161" text-anchor="middle" class="stage-name">Lexer + parser</text>
  <text x="485" y="185" text-anchor="middle" class="stage-file">src/token.c</text>
  <text x="485" y="211" text-anchor="middle" class="body">Bounded key=value syntax</text>

  <rect x="670" y="128" width="230" height="116" class="stage"/>
  <text x="785" y="161" text-anchor="middle" class="stage-name">Validated input AST</text>
  <text x="785" y="185" text-anchor="middle" class="stage-file">HauvieInput</text>
  <text x="785" y="211" text-anchor="middle" class="body">Patient fields + target</text>

  <rect x="970" y="128" width="190" height="116" class="core"/>
  <text x="1065" y="161" text-anchor="middle" class="stage-name">Core logic</text>
  <text x="1065" y="185" text-anchor="middle" class="stage-file">src/hauvie.c</text>
  <text x="1065" y="211" text-anchor="middle" class="body">Diagnostic result</text>

  <path d="M 300 186 H 360" class="flow"/>
  <text x="330" y="174" text-anchor="middle" class="label">1. ingest</text>
  <path d="M 600 186 H 660" class="flow"/>
  <text x="630" y="174" text-anchor="middle" class="label">2. parse</text>
  <path d="M 900 186 H 960" class="flow"/>
  <text x="930" y="174" text-anchor="middle" class="label">3. validate</text>

  <!-- Diagnostic report and router -->
  <rect x="830" y="330" width="300" height="100" class="core"/>
  <text x="980" y="364" text-anchor="middle" class="stage-name">Structured report</text>
  <text x="980" y="390" text-anchor="middle" class="stage-file">PipelineReport</text>
  <text x="980" y="412" text-anchor="middle" class="body">OK / critical / invalid input</text>
  <path d="M 1065 244 V 318" class="flow"/>
  <text x="1080" y="284" class="label">4. evaluate</text>

  <rect x="830" y="500" width="300" height="112" class="route"/>
  <text x="980" y="535" text-anchor="middle" class="stage-name">Output router</text>
  <text x="980" y="559" text-anchor="middle" class="stage-file">src/router.c</text>
  <text x="980" y="585" text-anchor="middle" class="body">Selects fixed C or Java template</text>
  <path d="M 980 430 V 488" class="flow"/>
  <text x="994" y="466" class="label">5. route</text>

  <rect x="830" y="680" width="140" height="78" class="route"/>
  <text x="900" y="713" text-anchor="middle" class="stage-name">C template</text>
  <text x="900" y="738" text-anchor="middle" class="small">starter output</text>
  <rect x="990" y="680" width="140" height="78" class="route"/>
  <text x="1060" y="713" text-anchor="middle" class="stage-name">Java template</text>
  <text x="1060" y="738" text-anchor="middle" class="small">starter output</text>
  <path d="M 920 612 V 650 H 900 V 668" class="flow"/>
  <path d="M 1040 612 V 650 H 1060 V 668" class="flow"/>

  <!-- Failure states -->
  <rect x="70" y="330" width="290" height="126" class="error"/>
  <text x="215" y="362" text-anchor="middle" class="stage-name" fill="#9c2935">Syntax / token error</text>
  <text x="215" y="390" text-anchor="middle" class="body">Malformed or oversized input</text>
  <text x="215" y="414" text-anchor="middle" class="body">No AST is returned; fail safely</text>
  <path d="M 485 244 V 290 H 215 V 318" class="failure-flow"/>
  <text x="350" y="280" text-anchor="middle" class="label" fill="#9c2935">invalid syntax</text>

  <rect x="400" y="500" width="330" height="146" class="error"/>
  <text x="565" y="533" text-anchor="middle" class="stage-name" fill="#9c2935">Critical diagnostic state</text>
  <text x="565" y="560" text-anchor="middle" class="body">Severity ≥ 0.75 or sulking=true</text>
  <text x="565" y="585" text-anchor="middle" class="body">Produces a critical report, not a null AST</text>
  <text x="565" y="614" text-anchor="middle" class="small">Routing remains available for diagnostics</text>
  <path d="M 1065 244 V 278 H 565 V 488" class="failure-flow"/>
  <text x="800" y="270" text-anchor="middle" class="label" fill="#9c2935">domain-level failure</text>
  <path d="M 730 573 H 818" class="failure-flow"/>
  <text x="774" y="560" text-anchor="middle" class="label" fill="#9c2935">report</text>

  <!-- Legend and scope -->
  <line x1="70" y1="798" x2="1128" y2="798" stroke="#d7e0e8" stroke-width="1"/>
  <line x1="82" y1="824" x2="132" y2="824" class="flow"/>
  <text x="145" y="829" class="small">normal data flow</text>
  <line x1="310" y1="824" x2="360" y2="824" class="failure-flow"/>
  <text x="373" y="829" class="small">failure / diagnostic path</text>
  <text x="1128" y="829" text-anchor="end" class="small">Router emits templates only; it does not compile or execute generated code.</text>
</svg>
